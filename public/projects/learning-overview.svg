<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Обзор учебной аналитики</title>
  <desc id="desc">Экран веб-сервиса с графиком активности, статусами заданий и таблицей курсов</desc>
  <style>
    text{font-family:'Segoe UI',sans-serif;fill:#243138}
    .muted{fill:#718087}.small{font-size:12px}.label{font-size:13px}.body{font-size:15px}.head{font-size:19px;font-weight:700}.strong{font-weight:700}.number{font-size:29px;font-weight:700}.nav{font-size:14px}
  </style>
  <rect width="1200" height="760" fill="#f4f7f8"/>
  <rect width="194" height="760" fill="#e9f0f1"/>
  <rect x="24" y="28" width="28" height="28" rx="7" fill="#286f7d"/>
